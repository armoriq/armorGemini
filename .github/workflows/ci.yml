name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the version copies
        run: node scripts/release/check-version.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      # The archive is what every auto-updating user receives, so a PR that breaks it fails here
      # rather than at release time.
      - name: Build the release archive
        run: |
          scripts/release/pack.sh armorgemini.tar.gz
          tar -tzf armorgemini.tar.gz | grep -qx './gemini-extension.json'
